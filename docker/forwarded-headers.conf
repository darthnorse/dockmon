# Preserve an external proxy's X-Forwarded-Host instead of overwriting it with
# this nginx's own Host. A fronting proxy that rewrites `Host: $host` drops the
# port, and X-Forwarded-Host is then the only header still carrying the origin
# the browser used (needed for OIDC redirect URIs).
#
# Only referenced by nginx-http.conf (REVERSE_PROXY_MODE), where the backend
# already trusts forwarded headers. Direct-access mode keeps overwriting them.
map $http_x_forwarded_host $dockmon_forwarded_host {
    ""      $http_host;
    default $http_x_forwarded_host;
}
